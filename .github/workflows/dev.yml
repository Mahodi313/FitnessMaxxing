name: Dev Branch CI

on:
  push:
    branches:
      - dev

# FIT-12: shared concurrency group with phase-branch.yml and main.yml so all
# workflows that run test:rls against the same Supabase project serialise.
# test-rls.ts uses fixed email prefixes and runs cleanupTestUsers() at start,
# which deletes ALL rls-test-* users — concurrent runs nuke each other's seed
# data. cancel-in-progress: false so each push gets its own accurate report.
concurrency:
  group: shared-supabase-test-rls
  cancel-in-progress: false

jobs:
  test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Installera dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: RLS tester
        run: npm run test:rls
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  expo-build:
    name: Expo Build Check
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      - name: Sätt upp Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Installera dependencies
        run: npm ci

      - name: Expo export check
        run: npx expo export --platform ios --output-dir /tmp/expo-export
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

  open-draft-pr-to-main:
    name: Öppna Draft PR mot main
    runs-on: ubuntu-latest
    needs: [test, expo-build]
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout kod
        uses: actions/checkout@v4

      # Läs aktuell milestone (version + namn + faser) från .planning så att
      # PR-titeln följer med när v1 → v2 → v3 ... Ingen hårdkodad version här.
      - name: Läs aktuell milestone från .planning
        id: milestone
        run: |
          PROJECT=.planning/PROJECT.md
          ROADMAP=.planning/ROADMAP.md

          # "## Current Milestone: v2.0 — Forge Redesign" → version + namn
          LINE=$(grep -m1 '^## Current Milestone:' "$PROJECT" | sed 's/^## Current Milestone:[[:space:]]*//')
          VERSION=$(printf '%s' "$LINE" | grep -oE 'v[0-9]+(\.[0-9]+)*' | head -1)
          NAME=$(printf '%s' "$LINE" | sed -E 's/^v[0-9.]+[[:space:]]*[—–-]+[[:space:]]*//')

          # Fallbacks om raden saknas/avviker — workflow får aldrig krascha på detta
          [ -z "$VERSION" ] && VERSION="vNext"
          [ -z "$NAME" ] && NAME="$VERSION"

          # Faser i den AKTIVA milestonen från ROADMAP:
          # börja vid "### ... active)", samla "#### Phase N: ..." tills nästa ## / ### rubrik
          PHASES=$(awk '
            /^### .*active\)/ { inblock=1; next }
            inblock && /^(##|###) / { exit }
            inblock && /^#### Phase / { line=$0; sub(/^#### /,"",line); print "- [ ] " line }
          ' "$ROADMAP")
          [ -z "$PHASES" ] && PHASES="- [ ] Se .planning/ROADMAP.md"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          {
            echo "phases<<PHASES_EOF"
            echo "$PHASES"
            echo "PHASES_EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Milestone: $VERSION — $NAME"

      - name: Öppna/uppdatera Draft PR mot main
        uses: actions/github-script@v7
        env:
          MILESTONE_VERSION: ${{ steps.milestone.outputs.version }}
          MILESTONE_NAME: ${{ steps.milestone.outputs.name }}
          MILESTONE_PHASES: ${{ steps.milestone.outputs.phases }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.MILESTONE_VERSION;
            const name = process.env.MILESTONE_NAME;
            const phases = process.env.MILESTONE_PHASES;
            const today = new Date().toISOString().split('T')[0];

            const title = `🚀 ${version} Release — dev → main`;
            const body = [
              `## FitnessMaxxing ${version} — ${name}`,
              ``,
              `Detta är en **Draft PR** som uppdateras automatiskt när kod mergas till \`dev\`.`,
              `Titel och faslista läses från \`.planning/PROJECT.md\` + \`.planning/ROADMAP.md\` — byt milestone där så följer PR:n med automatiskt.`,
              ``,
              `### Status`,
              `> Mergea INTE förrän alla ${version}-faser är klara och testade på riktigt i gymmet.`,
              ``,
              `### Faser`,
              phases,
              ``,
              `### Krav för att merga`,
              `- [ ] Alla faser verifierade av GSD`,
              `- [ ] Testat på gymmet`,
              `- [ ] Inga kända buggar`,
              ``,
              `---`,
              `*Automatiskt skapad av GitHub Actions · senaste push: ${today}*`,
            ].join('\n');

            const existingPRs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:dev`,
              base: 'main',
              state: 'open'
            });

            if (existingPRs.data.length > 0) {
              const pr = existingPRs.data[0];
              console.log('Draft PR finns redan:', pr.html_url);
              // Skriv om titel + body till aktuell milestone (self-heal vid milestone-byte)
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title,
                body
              });
              console.log(`Uppdaterade PR #${pr.number} → ${version}`);
              return;
            }

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              head: 'dev',
              base: 'main',
              draft: true,
              body
            });

            console.log('Draft PR skapad:', pr.data.html_url);
